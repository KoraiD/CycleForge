name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in what you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to http://localhost:3000
        2. Click "Try the demo prompt"
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Which mode were you running?
      options:
        - Local demo mode (no keys)
        - Fully configured (Trigger + ClickHouse + AI)
        - Partially configured
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: e.g. macOS 15, Chrome 138, Node 22
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste console or terminal errors, or attach a screenshot.
      render: text
